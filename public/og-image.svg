<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff6b3d" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#121318" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c0d10" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff6b3d" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242833" />
      <stop offset="100%" stop-color="#15171e" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0d10" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" />
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" />
  </g>

  <!-- Left Side: Brand & Text -->
  <g transform="translate(80, 110)">
    <!-- Logo Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="3" width="38" height="28" rx="5" stroke="#ff6b3d" stroke-width="4.5" />
      <rect x="16" y="16" width="32" height="28" rx="5" fill="#101114" stroke="#45d6c8" stroke-width="4.5" />
      <circle cx="40" cy="5" r="5" fill="#ffd166" />
    </g>

    <!-- Brand Name -->
    <text x="64" y="33" fill="#ffffff" font-family="Space Grotesk, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="1">MOKE FORGE</text>

    <!-- Tagline Badge -->
    <rect x="0" y="70" width="280" height="34" rx="17" fill="#181a22" stroke="#2a2e3d" stroke-width="1.5" />
    <text x="18" y="93" fill="#ff6b3d" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">PORTFOLIO MOCKUP STUDIO</text>

    <!-- Main Heading -->
    <text x="0" y="170" fill="#ffffff" font-family="Space Grotesk, -apple-system, sans-serif" font-size="52" font-weight="800" line-height="1.2">Create Stunning</text>
    <text x="0" y="235" fill="url(#gradText)" font-family="Space Grotesk, -apple-system, sans-serif" font-size="52" font-weight="800">Portfolio Mockups</text>
    <text x="0" y="300" fill="#ffffff" font-family="Space Grotesk, -apple-system, sans-serif" font-size="52" font-weight="800">in Minutes</text>

    <!-- Subtitle -->
    <text x="0" y="360" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="20" font-weight="400">Professional device frames, smart backgrounds &amp; high-res export.</text>
    <text x="0" y="390" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="20" font-weight="400">Laptops, mobile phones, tablets, browsers &amp; monitors.</text>

    <!-- Website URL -->
    <text x="0" y="445" fill="#45d6c8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500">https://mokeforge.vercel.app</text>
  </g>

  <!-- Right Side: Device Frame Visual -->
  <g transform="translate(680, 120)">
    <!-- Laptop Mockup Representation -->
    <g transform="translate(40, 40)">
      <!-- Screen frame -->
      <rect x="0" y="0" width="380" height="240" rx="14" fill="url(#frameGrad)" stroke="#3a4052" stroke-width="3" />
      <!-- Display screen -->
      <rect x="14" y="14" width="352" height="212" rx="6" fill="#0f1117" />
      <!-- Browser header in screen -->
      <rect x="14" y="14" width="352" height="24" rx="6" fill="#1b1d28" />
      <circle cx="28" cy="26" r="3.5" fill="#ff5f56" />
      <circle cx="40" cy="26" r="3.5" fill="#ffbd2e" />
      <circle cx="52" cy="26" r="3.5" fill="#27c93f" />
      <!-- Mock content blocks -->
      <rect x="34" y="55" width="140" height="14" rx="4" fill="#ff6b3d" opacity="0.9" />
      <rect x="34" y="80" width="220" height="8" rx="3" fill="#4b5563" />
      <rect x="34" y="96" width="180" height="8" rx="3" fill="#374151" />
      <rect x="34" y="120" width="90" height="80" rx="8" fill="#1e2230" />
      <rect x="135" y="120" width="90" height="80" rx="8" fill="#1e2230" />
      <rect x="236" y="120" width="90" height="80" rx="8" fill="#1e2230" />
      <!-- Laptop base -->
      <path d="M-40 240 H420 L400 256 H-20 Z" fill="#2d3240" stroke="#4a5166" stroke-width="2" />
      <rect x="160" y="240" width="60" height="5" rx="2" fill="#181a22" />
    </g>

    <!-- Mobile Phone Mockup Overlay -->
    <g transform="translate(300, 160)">
      <!-- Shadow -->
      <rect x="0" y="0" width="130" height="240" rx="24" fill="#000000" opacity="0.4" />
      <!-- Phone Body -->
      <rect x="0" y="0" width="130" height="240" rx="24" fill="#1c1f2b" stroke="#45d6c8" stroke-width="2.5" />
      <!-- Phone Screen -->
      <rect x="6" y="6" width="118" height="228" rx="18" fill="#0c0d10" />
      <!-- Dynamic Island / Notch -->
      <rect x="42" y="12" width="46" height="10" rx="5" fill="#1c1f2b" />
      <!-- Screen content -->
      <rect x="16" y="38" width="86" height="40" rx="6" fill="#1e2230" />
      <rect x="16" y="90" width="60" height="8" rx="3" fill="#ff6b3d" />
      <rect x="16" y="106" width="86" height="50" rx="6" fill="#181a24" />
      <rect x="16" y="166" width="86" height="50" rx="6" fill="#181a24" />
    </g>
  </g>
</svg>
